{% extends "base.html" %}
{% block titolo %}Accesso - Controlli{% endblock %}
{% block contenuto %}
<div class="scheda" style="max-width: 24rem; margin: 3rem auto;">
  <h2>Accesso</h2>
  {% if form.errors %}
    <p class="errore">Nome utente o password non corretti.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Nome utente</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit">Entra</button></p>
  </form>
</div>
{% endblock %}
